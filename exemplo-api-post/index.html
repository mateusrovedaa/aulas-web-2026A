<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastrar Skin</title>
</head>
<body>
  <h1>Cadastrar Skin</h1>

  <label>Nome: <input type="text" id="name"></label><br><br>
  <label>Preço: <input type="number" step="any" id="price"></label><br><br>
  <label>Desgaste: <input type="number" step="any" id="float"></label><br><br>
  <label>Raridade: <input type="text" id="rarity"></label><br><br>
  <button id="btn">Cadastrar</button>

  <pre id="resposta"></pre>

  <script>
    const butao = document.getElementById('btn');
    butao.addEventListener('click', async function () {
      const name = document.getElementById('name').value;
      const price = Number(document.getElementById('price').value);
      const float = Number(document.getElementById('float').value);
      const rarity = document.getElementById('rarity').value;
      
      const response = await fetch('https://6a289b104e1e783349a5b4e8.mockapi.io/api/skins/skins', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, price, float, rarity }),
      });

      const data = await response.json();
      document.getElementById('resposta').textContent = JSON.stringify(data);
    });
  </script>
</body>
</html>
